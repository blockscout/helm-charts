name: Lint PostHog chart

on:
  pull_request:
    paths:
      - 'charts/posthog/**'
  push:
    branches:
      - main
    paths:
      - 'charts/posthog/**'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Helm lint
        run: helm lint -f charts/posthog/ci/minimal-values.yaml charts/posthog

      - name: Helm template
        run: helm template -f charts/posthog/ci/minimal-values.yaml charts/posthog >/dev/null
