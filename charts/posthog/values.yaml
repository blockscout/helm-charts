# -----------------------------------------------------------------------------
# Jobs
# -----------------------------------------------------------------------------
jobs:
  migrate:
    enabled: true
    image:
      repository: ghcr.io/posthog/posthog
      tag: 10651753c3d6a5d58b2a46f6c94b89b93e8dbbb4
      digest: sha256:a693bf8425c977abcde44389e67ff1881079f7696f85576fbb4dfe0df0133ecd
      pullPolicy: IfNotPresent
    command:
      - sh
      - -c
      - python manage.py migrate --noinput && python manage.py apply_persons_migrations --hobby
    activeDeadlineSeconds: 3600
    backoffLimit: 2
    ttlSecondsAfterFinished: 86400
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: 2000m
        memory: 2Gi
  clickhouseMigrate:
    enabled: true
    image:
      repository: ghcr.io/posthog/posthog
      tag: 10651753c3d6a5d58b2a46f6c94b89b93e8dbbb4
      digest: sha256:a693bf8425c977abcde44389e67ff1881079f7696f85576fbb4dfe0df0133ecd
      pullPolicy: IfNotPresent
    command:
      - sh
      - -c
      - |
        set -e
        python - <<'PY'
        import os
        import socket
        import time

        deadline = time.monotonic() + 600
        while True:
            try:
                with socket.create_connection((os.environ["CLICKHOUSE_HOST"], int(os.environ["CLICKHOUSE_MIGRATE_WAIT_PORT"])), timeout=5):
                    print("ClickHouse native endpoint is ready")
                    break
            except OSError:
                if time.monotonic() >= deadline:
                    raise SystemExit("ClickHouse did not become ready within 600 seconds")
                time.sleep(5)
        PY
        python manage.py migrate_clickhouse
        python manage.py run_async_migrations
    # -- Native ClickHouse port checked before running migrations.
    waitPort: 9000
    activeDeadlineSeconds: 3600
    backoffLimit: 2
    ttlSecondsAfterFinished: 86400
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: 2000m
        memory: 2Gi
  asyncMigrationsCheck:
    enabled: true
    image:
      repository: ghcr.io/posthog/posthog
      tag: 10651753c3d6a5d58b2a46f6c94b89b93e8dbbb4
      digest: sha256:a693bf8425c977abcde44389e67ff1881079f7696f85576fbb4dfe0df0133ecd
      pullPolicy: IfNotPresent
    command:
      - python
      - manage.py
      - run_async_migrations
      - --check
    activeDeadlineSeconds: 1800
    backoffLimit: 2
    ttlSecondsAfterFinished: 86400
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: 2000m
        memory: 2Gi
  cyclotronMigrate:
    enabled: true
    # The migration directory is downloaded separately because the SQLx tool image
    # contains migrations from a newer upstream revision.
    sourceRevision: 10651753c3d6a5d58b2a46f6c94b89b93e8dbbb4
    image:
      repository: ghcr.io/posthog/posthog/sqlx-migrate
      tag: master
      digest: sha256:f24d083e9ef77f0b14c7797e6615b6bab653a488e1587284d536bbb89fb64507
      pullPolicy: IfNotPresent
    initImage:
      repository: alpine
      tag: "3.23"
      digest: sha256:49340b346798875b5592e5d420241f2f9cfba5f47e62ebb1446a1b34734e898f
      pullPolicy: IfNotPresent
    command:
      - sh
      - -c
      - |
        set -e
        sqlx database create -D "$CYCLOTRON_NODE_DATABASE_URL"
        sqlx migrate run -D "$CYCLOTRON_NODE_DATABASE_URL" --source /opt/cyclotron-node-migrations/
    activeDeadlineSeconds: 600
    backoffLimit: 2
    ttlSecondsAfterFinished: 86400
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
  kafkaInit:
