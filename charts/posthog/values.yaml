# Default values for posthog.
# This is a YAML-formatted file.

# -- Override the deployment and resource names.
nameOverride: ""
fullnameOverride: ""

# -- Common labels for all resources.
commonLabels: {}

# -- Pod annotations for all workloads.
podAnnotations: {}

# -- Image pull secrets.
imagePullSecrets: []

# -- ServiceAccount configuration.
serviceAccount:
  # -- Specifies whether a service account should be created.
  create: true
  # -- Annotations to add to the service account.
  annotations: {}
  # -- The name of the service account to use.
  name: ""

# -- Site URL used by PostHog to generate shareable links and for webhooks.
siteUrl: ""

# -- Django SECRET_KEY. Must be set via an existingSecret reference.
secretKey:
  existingSecret: ""
  key: "SECRET_KEY"

# -- Additional encryption salt keys for PostHog features.
encryptionSaltKeys:
  existingSecret: ""
  key: "ENCRYPTION_SALT_KEYS"

# -- Internal API secret used for service-to-service calls. Defaults to SECRET_KEY when empty.
internalApiSecret:
  existingSecret: ""
  key: "INTERNAL_API_SECRET"

# -- Internal request token shared by Django web/worker and feature-flags service.
internalRequestToken:
  existingSecret: ""
  key: "INTERNAL_REQUEST_TOKEN"

# -- Browserless Chromium token. Defaults to SECRET_KEY when empty.
browserless:
  token:
    existingSecret: ""
    key: "BROWSERLESS_TOKEN"

# -- Livestream JWT secret. Defaults to SECRET_KEY when empty.
livestream:
  jwtSecret:
    existingSecret: ""
    key: "LIVESTREAM_JWT_SECRET"

# -- Email / SMTP settings for invites and password resets.
email:
  enabled: false
  host: ""
  port: 587
  user: ""
  password:
    existingSecret: ""
    key: "SMTP_PASSWORD"
  useTls: true
  fromEmail: ""

# -- Disable PostHog's own product telemetry.
optOutCapture: true

# -- Disable self-signup. Invites are managed by email.
disabledSelfSignUp: true

# -- Allow only specific IP blocks (CIDR list). Capture endpoints are excluded.
allowedIpBlocks: ""

# -- Trust all proxies behind ingress-nginx.
trustAllProxies: true

# -- Deployment environment label.
deployment: "kubernetes"

# -- Pre-created secret containing the full DATABASE_URL. When set, inline URL is not used.
databaseUrl:
  existingSecret: ""
  key: "DATABASE_URL"

# -- Common environment variables injected into every PostHog workload.
extraEnv: []

# -- Global node selector for all workloads.
nodeSelector: {}

# -- Global tolerations for all workloads.
tolerations: []

# -- Global affinity for all workloads.
affinity: {}

# -- Pod topology spread constraints.
topologySpreadConstraints: []

# -- Security context for pods.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

# -- Security context for containers.
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

# -- Whether the instance is behind a reverse proxy / ingress.
isBehindProxy: true

# -----------------------------------------------------------------------------
# Ingress
# -----------------------------------------------------------------------------
ingress:
  enabled: true
  # -- IngressClass name.
  className: nginx
  # -- Additional annotations for all ingress resources.
  annotations: {}
  # -- TLS configuration.
  tls:
    enabled: true
    # -- TLS secret name. If empty, cert-manager will be expected to provision it.
    secretName: ""
  # -- Public hostname.
  host: "posthog.local"
  # -- Paths and their target service ports.
  routes:
    web:
      paths:
        - path: /
          pathType: Prefix
      servicePort: 8000
    capture:
      paths:
        - path: /e
          pathType: Prefix
        - path: /i/v0
          pathType: Prefix
        - path: /i/v1/analytics/events
          pathType: Prefix
        - path: /batch
          pathType: Prefix
        - path: /capture
          pathType: Prefix
      servicePort: 3000
      annotations:
        nginx.ingress.kubernetes.io/proxy-body-size: "50m"
        nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    feature-flags:
      paths:
        - path: /flags
          pathType: Prefix
        - path: /api/feature_flag/local_evaluation
          pathType: Prefix
      servicePort: 3001
    hypercache-server:
      paths:
        - path: /array
          pathType: Prefix
        - path: /surveys
          pathType: Prefix
        - path: /api/surveys
          pathType: Prefix
      servicePort: 3002
    plugins:
      paths:
        - path: /public/webhooks
          pathType: Prefix
        - path: /public/m
          pathType: Prefix
      servicePort: 6738
    livestream:
      paths:
        - path: /livestream
          pathType: Prefix
      servicePort: 8080
      annotations:
        nginx.ingress.kubernetes.io/proxy-buffering: "off"
        nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
        nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
        nginx.ingress.kubernetes.io/rewrite-target: "/"

# -----------------------------------------------------------------------------
# External PostgreSQL
# -----------------------------------------------------------------------------
externalPostgresql:
  host: ""
  port: 5432
  database: "posthog"
  user: ""
  password:
    existingSecret: ""
    key: "password"
  sslMode: "require"

# -----------------------------------------------------------------------------
# External Object Storage (S3-compatible)
# -----------------------------------------------------------------------------
externalObjectStorage:
  endpoint: ""
  publicEndpoint: ""
  region: "us-east-1"
  bucket: "posthog"
  forcePathStyle: true
  accessKey:
    existingSecret: ""
    key: "AWS_ACCESS_KEY_ID"
  secretKey:
    existingSecret: ""
    key: "AWS_SECRET_ACCESS_KEY"

# -----------------------------------------------------------------------------
# External Kafka / Redpanda
# Set enabled=false to deploy the built-in Redpanda single-node StatefulSet.
# -----------------------------------------------------------------------------
externalKafka:
  enabled: false
  brokers: ""
  # -- SASL/SSL configuration when using external Kafka.
  securityProtocol: "PLAINTEXT"
  saslMechanism: "PLAIN"
  saslUsername: ""
  saslPassword:
    existingSecret: ""
    key: "password"

# -----------------------------------------------------------------------------
# External ClickHouse
# Set enabled=false to deploy the built-in ClickHouse StatefulSet.
# -----------------------------------------------------------------------------
externalClickhouse:
  enabled: false
  host: ""
  database: "posthog"
  user: "default"
  password:
    existingSecret: ""
    key: "password"
  secure: false
  verify: false

