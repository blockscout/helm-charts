# -----------------------------------------------------------------------------
# Component-level configuration
# -----------------------------------------------------------------------------
components:
  # -----------------------------------------------------------------------------
  # PostHog web (Django + frontend)
  # -----------------------------------------------------------------------------
  web:
    enabled: true
    replicaCount: 2
    image:
      repository: ghcr.io/posthog/posthog/posthog
      tag: master
      digest: sha256:1322b2cccac4a405bc1f6f855a22a25c1e1468cbfcb9a8e8962baf74f25cd3a6
      pullPolicy: IfNotPresent
    command:
      - /bin/sh
      - -c
      - ./bin/start-backend & ./bin/start-frontend
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: 2000m
        memory: 2Gi
    service:
      port: 8000
    livenessProbe:
      httpGet:
        path: /_health/
        port: http
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    readinessProbe:
      httpGet:
        path: /_health/
        port: http
      initialDelaySeconds: 5
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 3
    env: []
    nodeSelector: {}
    tolerations: []
    affinity: {}
    podDisruptionBudget:
      enabled: true
      minAvailable: 1

  # -----------------------------------------------------------------------------
  # Celery worker with scheduler
  # -----------------------------------------------------------------------------
  worker:
    enabled: true
    replicaCount: 1
    image:
      repository: ghcr.io/posthog/posthog/posthog
      tag: master
      digest: sha256:1322b2cccac4a405bc1f6f855a22a25c1e1468cbfcb9a8e8962baf74f25cd3a6
