      - --with-embedded-scheduler
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: 2000m
        memory: 2Gi
    livenessProbe:
      exec:
        command:
          - sh
          - -c
          - pgrep -f celery || exit 1
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    readinessProbe:
      exec:
        command:
          - sh
          - -c
