{{- $root := . -}}
{{- $component := .Values.components.featureFlags -}}
{{- if $component.enabled }}
{{- $databaseUrlEnv := dict "valueFrom" (dict "secretKeyRef" (dict "name" $root.Values.databaseUrl.existingSecret "key" $root.Values.databaseUrl.key)) -}}
{{- $featureFlagsEnv := list
  (dict "name" "WRITE_DATABASE_URL" "valueFrom" $databaseUrlEnv.valueFrom)
  (dict "name" "READ_DATABASE_URL" "valueFrom" $databaseUrlEnv.valueFrom)
  (dict "name" "PERSONS_WRITE_DATABASE_URL" "valueFrom" $databaseUrlEnv.valueFrom)
  (dict "name" "PERSONS_READ_DATABASE_URL" "valueFrom" $databaseUrlEnv.valueFrom)
-}}
{{- $mergedComponent := merge (dict "env" (concat $featureFlagsEnv $component.env)) $component -}}
{{- include "posthog.service" (dict "root" $root "name" "feature-flags" "port" $component.service.port "enabled" true) }}
---
{{- include "posthog.deployment" (dict "root" $root "name" "feature-flags" "component" $mergedComponent) }}
---
{{- if $component.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "posthog.fullname" $root }}-feature-flags
  labels:
    {{- include "posthog.componentLabels" (dict "root" $root "component" "feature-flags") | nindent 4 }}
spec:
  minAvailable: {{ $component.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "posthog.componentSelectorLabels" (dict "root" $root "component" "feature-flags") | nindent 6 }}
{{- end }}
{{- end }}
