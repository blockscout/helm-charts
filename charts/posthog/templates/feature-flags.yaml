{{- $root := . -}}
{{- $component := .Values.components.featureFlags -}}
{{- if $component.enabled }}
{{- include "posthog.service" (dict "root" $root "name" "feature-flags" "port" $component.service.port "enabled" true) }}
---
{{- include "posthog.deployment" (dict "root" $root "name" "feature-flags" "component" $component) }}
---
{{- if $component.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "posthog.fullname" $root }}-feature-flags
  labels:
    {{- include "posthog.componentLabels" (dict "root" $root "component" "feature-flags") | nindent 4 }}
spec:
  minAvailable: {{ $component.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "posthog.componentSelectorLabels" (dict "root" $root "component" "feature-flags") | nindent 6 }}
{{- end }}
{{- end }}
