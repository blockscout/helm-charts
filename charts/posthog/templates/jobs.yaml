---
{{- if .Values.jobs.kafkaInit.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "posthog.fullname" . }}-kafka-init
  labels:
    {{- include "posthog.componentLabels" (dict "root" . "component" "kafka-init") | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "1"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  activeDeadlineSeconds: {{ .Values.jobs.kafkaInit.activeDeadlineSeconds }}
  backoffLimit: {{ .Values.jobs.kafkaInit.backoffLimit }}
  ttlSecondsAfterFinished: {{ .Values.jobs.kafkaInit.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "posthog.componentSelectorLabels" (dict "root" . "component" "kafka-init") | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "posthog.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      restartPolicy: OnFailure
      containers:
        - name: kafka-init
          image: {{ include "posthog.image" (list . .Values.jobs.kafkaInit.image) | quote }}
          imagePullPolicy: {{ .Values.jobs.kafkaInit.image.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - |
              set -x
              echo "Waiting for Kafka broker to accept connections..."
              TIMEOUT=60
              ELAPSED=0
              until rpk topic list --brokers {{ include "posthog.kafka.brokers" . }} 2>/dev/null; do
                echo "Kafka broker not ready yet (elapsed: ${ELAPSED}s)..."
                sleep 2
                ELAPSED=$((ELAPSED + 2))
                if [ "${ELAPSED}" -ge "${TIMEOUT}" ]; then
                  echo "Timeout waiting for Kafka broker after ${TIMEOUT}s"
                  rpk topic list --brokers {{ include "posthog.kafka.brokers" . }} || true
                  exit 1
                fi
              done
              echo "Kafka broker is accepting requests, creating topics..."
              TOPICS="$(grep -vE '^[[:space:]]*#|^[[:space:]]*$' /topics.txt) personhog_updates personhog_changelog_relay_dlq"
              for topic in ${TOPICS}; do
                if rpk topic create "${topic}" --brokers {{ include "posthog.kafka.brokers" . }} -p 1 -r 1 2>&1; then
                  echo "Topic ${topic} created successfully"
                else
                  if rpk topic list --brokers {{ include "posthog.kafka.brokers" . }} | awk '{print $1}' | grep -qx "${topic}"; then
                    echo "Topic ${topic} already exists, continuing"
                  else
                    echo "Failed to create topic ${topic}"
                    exit 1
                  fi
                fi
              done
              echo "Final topic list:"
              rpk topic list --brokers {{ include "posthog.kafka.brokers" . }}
              echo "Topics ready"
          volumeMounts:
            - name: topics
              mountPath: /topics.txt
              subPath: topics.txt
          resources:
            {{- toYaml .Values.jobs.kafkaInit.resources | nindent 12 }}
      volumes:
        - name: topics
          configMap:
            name: {{ include "posthog.fullname" . }}-kafka-topics
{{- end }}
---
{{- if and .Values.jobs.personhogEtcdInit.enabled .Values.components.personhog.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "posthog.fullname" . }}-personhog-etcd-init
  labels:
    {{- include "posthog.componentLabels" (dict "root" . "component" "personhog-etcd-init") | nindent 4 }}
  # A regular Job: router/leader readiness depends on this key, so a post-install
  # hook would deadlock when Helm is run with --wait.
spec:
  activeDeadlineSeconds: {{ .Values.jobs.personhogEtcdInit.activeDeadlineSeconds }}
  backoffLimit: {{ .Values.jobs.personhogEtcdInit.backoffLimit }}
  ttlSecondsAfterFinished: {{ .Values.jobs.personhogEtcdInit.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "posthog.componentSelectorLabels" (dict "root" . "component" "personhog-etcd-init") | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "posthog.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      restartPolicy: OnFailure
      containers:
        - name: etcd-init
          image: {{ include "posthog.image" (list . .Values.jobs.personhogEtcdInit.image) | quote }}
          imagePullPolicy: {{ .Values.jobs.personhogEtcdInit.image.pullPolicy }}
          command:
            - etcdctl
            - --endpoints=http://{{ include "posthog.fullname" . }}-etcd:2379
            - put
            - /personhog/config/changelog
            - '{"topic":"personhog_updates","partitions":1,"epoch":1,"writer_group":"personhog-writer","retire_groups":["personhog-changelog-relay"],"draining":[]}'
          resources:
            {{- toYaml .Values.jobs.personhogEtcdInit.resources | nindent 12 }}
{{- end }}
---
{{- if and .Values.jobs.personhogTablesReady.enabled .Values.components.personhog.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "posthog.fullname" . }}-personhog-tables-ready
  labels:
    {{- include "posthog.componentLabels" (dict "root" . "component" "personhog-tables-ready") | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "11"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  activeDeadlineSeconds: {{ .Values.jobs.personhogTablesReady.activeDeadlineSeconds }}
  backoffLimit: {{ .Values.jobs.personhogTablesReady.backoffLimit }}
  ttlSecondsAfterFinished: {{ .Values.jobs.personhogTablesReady.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "posthog.componentSelectorLabels" (dict "root" . "component" "personhog-tables-ready") | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "posthog.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      restartPolicy: OnFailure
      containers:
        - name: wait
          image: {{ include "posthog.image" (list . .Values.jobs.personhogTablesReady.image) | quote }}
          imagePullPolicy: {{ .Values.jobs.personhogTablesReady.image.pullPolicy }}
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.externalPostgresql.password.existingSecret | quote }}
                  key: {{ .Values.externalPostgresql.password.key | quote }}
          command:
            - sh
            - -c
            - |
              until psql -h {{ .Values.externalPostgresql.host }} -p {{ .Values.externalPostgresql.port }} -U {{ .Values.externalPostgresql.user }} -d {{ .Values.externalPostgresql.database }} -tAc "SELECT to_regclass('lifecycle_op_person') IS NOT NULL AND to_regclass('person_publish_outbox') IS NOT NULL" | grep -q t; do
                echo "Waiting for the persons migrations"
                sleep 5
              done
          resources:
            {{- toYaml .Values.jobs.personhogTablesReady.resources | nindent 12 }}
{{- end }}
