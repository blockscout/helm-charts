{{- if .Values.jobs.migrate.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "posthog.fullname" . }}-migrate
  labels:
    {{- include "posthog.componentLabels" (dict "root" . "component" "migrate") | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  activeDeadlineSeconds: {{ .Values.jobs.migrate.activeDeadlineSeconds }}
  backoffLimit: {{ .Values.jobs.migrate.backoffLimit }}
  ttlSecondsAfterFinished: {{ .Values.jobs.migrate.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "posthog.componentSelectorLabels" (dict "root" . "component" "migrate") | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "posthog.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: {{ include "posthog.image" (list . .Values.jobs.migrate.image) | quote }}
          imagePullPolicy: {{ .Values.jobs.migrate.image.pullPolicy }}
          command:
            {{- toYaml .Values.jobs.migrate.command | nindent 12 }}
          env:
            {{- include "posthog.commonEnv" . | nindent 12 }}
          resources:
            {{- toYaml .Values.jobs.migrate.resources | nindent 12 }}
{{- end }}
