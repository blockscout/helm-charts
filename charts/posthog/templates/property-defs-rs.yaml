{{- $root := . -}}
{{- $component := .Values.components.propertyDefsRs -}}
{{- if $component.enabled }}
{{- include "posthog.service" (dict "root" $root "name" "property-defs-rs" "port" $component.service.port "enabled" true) }}
---
{{- include "posthog.deployment" (dict "root" $root "name" "property-defs-rs" "component" $component) }}
{{- end }}
