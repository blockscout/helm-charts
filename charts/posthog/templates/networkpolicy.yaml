{{- if .Values.networkPolicy.enabled }}
{{- $fullname := include "posthog.fullname" . -}}
{{- $ingressPorts := list -}}
{{- range .Values.ingress.routes -}}
{{- if hasKey . "servicePort" -}}
{{- $ingressPorts = append $ingressPorts .servicePort -}}
{{- end -}}
{{- end -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-default-deny-egress
  labels:
    {{- include "posthog.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "posthog.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Egress
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-default-deny-ingress
  labels:
    {{- include "posthog.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "posthog.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-allow-dns
  labels:
    {{- include "posthog.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "posthog.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-allow-internal
  labels:
    {{- include "posthog.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "posthog.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "posthog.selectorLabels" . | nindent 14 }}
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- include "posthog.selectorLabels" . | nindent 14 }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-allow-ingress-controller
  labels:
    {{- include "posthog.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "posthog.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
      ports:
        {{- range $ingressPorts | uniq }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
{{- with .Values.networkPolicy.extraIngress }}
{{- $root := $ }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "posthog.fullname" $root }}-extra-ingress
  labels:
    {{- include "posthog.labels" $root | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "posthog.selectorLabels" $root | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    {{- toYaml . | nindent 4 }}
{{- end }}
{{- if .Values.networkPolicy.postgresqlCIDRs }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-allow-postgresql
  labels:
    {{- include "posthog.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "posthog.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    - ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.postgresqlPort }}
      to:
        {{- range .Values.networkPolicy.postgresqlCIDRs }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
{{- end }}
