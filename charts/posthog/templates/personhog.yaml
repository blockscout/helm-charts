      {{- end }}
      serviceAccountName: {{ include "posthog.serviceAccountName" $root }}
      securityContext:
        {{- toYaml $root.Values.podSecurityContext | nindent 8 }}
      containers:
        - name: personhog-router
          image: {{ include "posthog.image" (list $root $c.images.router) | quote }}
          imagePullPolicy: {{ $c.images.router.pullPolicy }}
          ports:
            - name: grpc
              containerPort: {{ $c.services.routerPort }}
              protocol: TCP
          env:
            - name: GRPC_ADDRESS
              value: "0.0.0.0:{{ $c.services.routerPort }}"
            - name: REPLICA_URL
              value: "http://{{ $fullname }}-personhog-replica:{{ $c.services.replicaPort }}"
            - name: BACKEND_TIMEOUT_MS
              value: "5000"
            - name: RUST_LOG
              value: "info"
            - name: METRICS_PORT
              value: "9101"
          livenessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
