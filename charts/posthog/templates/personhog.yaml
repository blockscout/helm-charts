{{- if .Values.components.personhog.enabled }}
{{- $root := . -}}
{{- $c := .Values.components.personhog -}}
{{- $fullname := include "posthog.fullname" . -}}
# Services
{{- range list (dict "name" "personhog-replica" "port" $c.services.replicaPort) (dict "name" "personhog-router" "port" $c.services.routerPort) (dict "name" "personhog-router-leader" "port" $c.services.routerLeaderPort) (dict "name" "personhog-leader" "port" $c.services.leaderPort) (dict "name" "personhog-identity" "port" $c.services.identityPort) }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-{{ .name }}
  labels:
    {{- include "posthog.componentLabels" (dict "root" $root "component" .name) | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .port }}
      targetPort: grpc
      protocol: TCP
      name: grpc
  selector:
    {{- include "posthog.componentSelectorLabels" (dict "root" $root "component" .name) | nindent 4 }}
{{- end }}
# Deployments
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-personhog-replica
  labels:
    {{- include "posthog.componentLabels" (dict "root" $root "component" "personhog-replica") | nindent 4 }}
spec:
  replicas: {{ $c.replicaCount }}
  selector:
    matchLabels:
      {{- include "posthog.componentSelectorLabels" (dict "root" $root "component" "personhog-replica") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "posthog.componentSelectorLabels" (dict "root" $root "component" "personhog-replica") | nindent 8 }}
    spec:
      {{- with $root.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "posthog.serviceAccountName" $root }}
      securityContext:
        {{- toYaml $root.Values.podSecurityContext | nindent 8 }}
      containers:
        - name: personhog-replica
          image: {{ include "posthog.image" (list $root $c.images.replica) | quote }}
          imagePullPolicy: {{ $c.images.replica.pullPolicy }}
          ports:
            - name: grpc
              containerPort: {{ $c.services.replicaPort }}
              protocol: TCP
          env:
            - name: GRPC_ADDRESS
              value: "0.0.0.0:{{ $c.services.replicaPort }}"
            - name: PRIMARY_DATABASE_URL
              {{- include "posthog.databaseUrl" $root | nindent 14 }}
            - name: RUST_LOG
              value: "info"
            - name: METRICS_PORT
              value: "9100"
          livenessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml $c.resources | nindent 12 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-personhog-router
  labels:
    {{- include "posthog.componentLabels" (dict "root" $root "component" "personhog-router") | nindent 4 }}
spec:
  replicas: {{ $c.replicaCount }}
  selector:
    matchLabels:
      {{- include "posthog.componentSelectorLabels" (dict "root" $root "component" "personhog-router") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "posthog.componentSelectorLabels" (dict "root" $root "component" "personhog-router") | nindent 8 }}
