---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-personhog-leader
  labels:
    {{- include "posthog.componentLabels" (dict "root" $root "component" "personhog-leader") | nindent 4 }}
spec:
  replicas: {{ $c.replicaCount }}
  selector:
    matchLabels:
      {{- include "posthog.componentSelectorLabels" (dict "root" $root "component" "personhog-leader") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "posthog.componentSelectorLabels" (dict "root" $root "component" "personhog-leader") | nindent 8 }}
    spec:
      {{- with $root.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "posthog.serviceAccountName" $root }}
      securityContext:
        {{- toYaml $root.Values.podSecurityContext | nindent 8 }}
      containers:
        - name: personhog-leader
          image: {{ include "posthog.image" (list $root $c.images.leader) | quote }}
          imagePullPolicy: {{ $c.images.leader.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - POD_IP=$(hostname -i) exec /usr/local/bin/personhog-leader
          ports:
            - name: grpc
              containerPort: {{ $c.services.leaderPort }}
              protocol: TCP
          env:
            - name: GRPC_ADDRESS
              value: "0.0.0.0:{{ $c.services.leaderPort }}"
            - name: CACHE_MEMORY_CAPACITY
              value: "100000"
            - name: ETCD_ENDPOINTS
              value: "http://{{ $fullname }}-etcd:2379"
            - name: ETCD_PREFIX
              value: "/personhog/"
            - name: POD_NAME
              value: "personhog-leader"
            - name: KAFKA_HOSTS
              value: {{ include "posthog.kafka.brokers" $root | quote }}
            - name: FALLBACK_DATABASE_URL
              {{- include "posthog.databaseUrl" $root | nindent 14 }}
            - name: FALLBACK_TABLE
              value: "posthog_person"
            - name: RUST_LOG
              value: "info"
            - name: METRICS_PORT
              value: "9102"
          livenessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml $c.resources | nindent 12 }}
---
