{{- $root := . -}}
{{- $component := .Values.components.capture -}}
{{- if $component.enabled }}
{{- $captureEnv := list
  (dict "name" "KAFKA_INGESTION_PRODUCER_METADATA_BROKER_LIST" "value" (include "posthog.kafka.brokers" $root))
-}}
{{- $mergedComponent := merge (dict "env" (concat $captureEnv $component.env)) $component -}}
{{- include "posthog.service" (dict "root" $root "name" "capture" "port" $component.service.port "enabled" true) }}
---
{{- include "posthog.deployment" (dict "root" $root "name" "capture" "component" $mergedComponent) }}
---
{{- if $component.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "posthog.fullname" $root }}-capture
  labels:
    {{- include "posthog.componentLabels" (dict "root" $root "component" "capture") | nindent 4 }}
spec:
  minAvailable: {{ $component.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "posthog.componentSelectorLabels" (dict "root" $root "component" "capture") | nindent 6 }}
{{- end }}
{{- end }}
