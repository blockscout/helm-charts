{{- if and .Values.blockscout.separateApi.enabled .Values.blockscout.envFromSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "blockscout-stack.fullname" . }}-blockscout-migration-env
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
  labels:
    {{- include "blockscout-stack.labels" . | nindent 4 }}
type: Opaque
data:
{{- if .Values.blockscout.nftStorage.enabled }}
  NFT_MEDIA_HANDLER_AWS_PUBLIC_BUCKET_URL: {{ .Values.blockscout.nftStorage.bucketUrl | b64enc }}
{{- end }}
{{- if or .Values.blockscout.nftStorage.enabled .Values.blockscout.separateApi.enabled }}
  RELEASE_COOKIE: {{ .Values.blockscout.releaseCookie | b64enc }}
{{- end }}
{{- range $key, $value := .Values.blockscout.envFromSecret }}
  {{ $key }}: {{ $value | b64enc }}
{{- end }}
{{- end }}
