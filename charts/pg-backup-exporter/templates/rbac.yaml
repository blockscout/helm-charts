{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "pg-backup-exporter.fullname" . }}
  labels:
    {{- include "pg-backup-exporter.labels" . | nindent 4 }}
rules:
  - apiGroups: ["acid.zalan.do"]
    resources: ["postgresqls"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "pg-backup-exporter.fullname" . }}
  labels:
    {{- include "pg-backup-exporter.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "pg-backup-exporter.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "pg-backup-exporter.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
