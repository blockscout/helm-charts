apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pg-backup-exporter.fullname" . }}
  labels:
    {{- include "pg-backup-exporter.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "pg-backup-exporter.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "pg-backup-exporter.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "pg-backup-exporter.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: PG_BACKUP_S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "pg-backup-exporter.fullname" . }}-s3
                  key: access-key
            - name: PG_BACKUP_S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "pg-backup-exporter.fullname" . }}-s3
                  key: secret-key
            - name: PG_BACKUP_S3_ENDPOINT
              value: {{ .Values.s3.endpoint | quote }}
            - name: PG_BACKUP_S3_BUCKET
              value: {{ .Values.s3.bucket | quote }}
            - name: PG_BACKUP_S3_REGION
              value: {{ .Values.s3.region | quote }}
            - name: PG_BACKUP_S3_SECURE
              value: {{ .Values.s3.secure | quote }}
            - name: PG_BACKUP_REFRESH_EVERY
              value: {{ .Values.refresh.every | quote }}
            - name: PG_BACKUP_RETRY_EVERY
              value: {{ .Values.refresh.retryEvery | quote }}
            - name: PG_BACKUP_CONCURRENCY
              value: {{ .Values.refresh.concurrency | quote }}
            - name: PG_BACKUP_LIST_TIMEOUT
              value: {{ .Values.refresh.listTimeout | quote }}
            - name: PG_BACKUP_REQUEST_TIMEOUT
              value: {{ .Values.refresh.requestTimeout | quote }}
            - name: PG_BACKUP_DISCOVERY_EVERY
              value: {{ .Values.refresh.discoveryEvery | quote }}
            - name: PG_BACKUP_NAMESPACE
              value: {{ .Values.namespace | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: http
          readinessProbe:
            httpGet:
              path: /health
              port: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
