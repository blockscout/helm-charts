apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pg-backup-exporter.fullname" . }}-s3
  labels:
    {{- include "pg-backup-exporter.labels" . | nindent 4 }}
type: Opaque
data:
  access-key: {{ .Values.s3.accessKey | b64enc | quote }}
  secret-key: {{ .Values.s3.secretKey | b64enc | quote }}
